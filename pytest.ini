[pytest]
asyncio_mode = auto
# тесты и фикстуры модуля — в одном цикле событий: asyncpg (PostgreSQL) не переносит
# соединения между циклами, а клиент и база живут на уровне модуля
asyncio_default_fixture_loop_scope = module
asyncio_default_test_loop_scope = module
testpaths = tests
addopts = -q --tb=short
