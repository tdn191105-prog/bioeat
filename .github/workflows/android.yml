# Сборка debug-APK обёртки РосПит (Capacitor).
# Запуск: GitHub → Actions → «Android APK» → Run workflow → указать адрес сервера.
# Готовый файл — в артефакте rospit-debug-apk (Actions → запуск → Artifacts).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Публичный HTTPS-адрес веб-версии (server.url)"
        required: true
        default: "https://rospit.example.ru"
  push:
    branches: [rospit, main]
    paths: ["mobile/**", ".github/workflows/android.yml"]

jobs:
  build:
    # ubuntu-latest переезжает на Ubuntu 26 — на 24.04 Android SDK предустановлен
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      CAP_SERVER_URL: ${{ github.event.inputs.server_url || vars.ROSPIT_SERVER_URL || 'https://rospit.example.ru' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Зависимости
        run: npm ci

      - name: Синхронизация Capacitor (адрес сервера → capacitor.config.json)
        run: npx cap sync android

      - name: Сборка debug-APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "rospit-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rospit-debug-apk
          path: mobile/rospit-debug.apk
          retention-days: 30
